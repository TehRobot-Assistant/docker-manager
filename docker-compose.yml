services:
  docker-manager:
    image: tehrobot/docker-manager:latest
    container_name: docker-manager
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config:/config
    environment:
      - PORT=3000
      - ADMIN_PASSWORD=changeme
      - CONFIG_PATH=/config
    restart: unless-stopped
